<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>静水鱼缸 · Aquarium</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#020a0c;
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;cursor:crosshair}
  body.wall{cursor:default}
  #tank{display:block;position:fixed;inset:0}

  #glass{position:fixed;inset:0;pointer-events:none;z-index:2;
    background:
      radial-gradient(120% 100% at 50% 42%, transparent 55%, rgba(0,0,0,.55) 100%),
      linear-gradient(to bottom, rgba(0,20,26,.10) 0%, transparent 18%, transparent 82%, rgba(0,10,12,.28) 100%);
    box-shadow: inset 0 0 120px 10px rgba(0,0,0,.45);}

  .hud{display:none!important;position:fixed;left:22px;top:18px;z-index:4;font-size:11.5px;letter-spacing:.14em;
    color:rgba(178,228,224,.55);opacity:0;transition:opacity .6s ease;
    pointer-events:none;font-variant-numeric:tabular-nums}
  .hud.on{opacity:1}
  .hud b{font-weight:600;color:rgba(210,252,246,.9)}
  .hud i{font-style:normal;color:rgba(120,190,185,.45);margin:0 8px}

  .ui{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:6;
    display:flex;align-items:center;gap:10px;padding:9px 13px;border-radius:999px;
    background:rgba(4,20,23,.5);border:1px solid rgba(150,230,220,.10);
    backdrop-filter:blur(14px) saturate(120%);
    box-shadow:0 12px 40px rgba(0,0,0,.55), inset 0 1px 0 rgba(190,255,248,.05);
    opacity:.14;transition:opacity .45s ease, transform .45s ease}
  .ui:hover,.ui.open{opacity:1;transform:translateX(-50%) translateY(-2px)}
  .btn{position:relative;width:38px;height:38px;border-radius:50%;border:1px solid rgba(160,235,225,.12);
    background:radial-gradient(circle at 50% 30%, rgba(160,255,245,.08), rgba(6,30,34,.55));
    color:rgba(196,246,240,.82);display:grid;place-items:center;cursor:pointer;
    transition:transform .2s ease, border-color .2s ease, background .2s ease, color .2s ease}
  .btn:hover{transform:translateY(-3px);border-color:rgba(180,255,245,.36);color:#eafffb;
    background:radial-gradient(circle at 50% 30%, rgba(180,255,248,.18), rgba(8,40,44,.7))}
  .btn:active{transform:translateY(-1px) scale(.94)}
  .btn svg{width:19px;height:19px;display:block}
  .btn span{position:absolute;bottom:46px;left:50%;transform:translateX(-50%) translateY(4px);
    white-space:nowrap;font-size:11px;letter-spacing:.1em;color:rgba(206,250,246,.9);
    background:rgba(4,18,21,.92);border:1px solid rgba(150,230,220,.12);
    padding:4px 9px;border-radius:6px;opacity:0;pointer-events:none;transition:.22s ease}
  .btn:hover span{opacity:1;transform:translateX(-50%) translateY(0)}

  .picker{position:fixed;left:50%;bottom:76px;transform:translateX(-50%) translateY(10px);z-index:6;
    display:grid;grid-template-columns:repeat(4,146px);gap:8px;padding:12px;border-radius:18px;
    background:rgba(4,16,19,.86);border:1px solid rgba(150,230,220,.12);
    backdrop-filter:blur(16px) saturate(120%);
    box-shadow:0 18px 50px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.25s ease}
  .picker.on{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
  .card{cursor:pointer;border:1px solid rgba(150,230,220,.08);border-radius:12px;
    background:linear-gradient(180deg, rgba(16,50,56,.55), rgba(4,16,20,.6));
    padding:8px 6px 7px;display:flex;flex-direction:column;align-items:center;gap:4px;overflow:hidden;
    transition:.18s ease;color:rgba(200,244,240,.78)}
  .card:hover{border-color:rgba(170,255,245,.4);transform:translateY(-2px);
    background:linear-gradient(180deg, rgba(24,76,82,.7), rgba(6,22,26,.75));color:#eafffb}
  .card canvas{width:100px;height:46px;display:block;position:static;border-radius:8px}

  .hint{display:none!important;position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:4;
    font-size:12px;letter-spacing:.16em;color:rgba(186,236,230,.55);white-space:nowrap;
    opacity:0;transition:opacity 1.2s ease;pointer-events:none;text-shadow:0 2px 14px rgba(0,0,0,.85)}
  .hint.on{opacity:1}

  body.wall .ui, body.wall .hint, body.wall .hud, body.wall .picker{display:none}
</style>
</head>
<body>
<canvas id="tank"></canvas>
<div id="glass"></div>
<div class="hud" id="hud"></div>
<div class="picker" id="picker"></div>
<div class="ui" id="ui">
  <button class="btn" data-act="feed" aria-label="喂食">
    <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="8.6" cy="6.4" r="1.5"/><circle cx="14" cy="9.6" r="1.3"/><circle cx="9.4" cy="13" r="1.4"/><circle cx="15.2" cy="15.4" r="1.2"/><circle cx="10.4" cy="18.4" r="1.3"/></svg>
    <span>喂食 · Space</span>
  </button>
  <button class="btn" data-act="pet" aria-label="逗鱼">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="6.4" opacity=".55"/><circle cx="12" cy="12" r="10" opacity=".22"/></svg>
    <span>逗鱼 · 鼠标靠近</span>
  </button>
  <button class="btn" data-act="clean" aria-label="换水">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M12 3.6c2.9 4 5.7 6.8 5.7 9.6a5.7 5.7 0 0 1-11.4 0c0-2.8 2.8-5.6 5.7-9.6z"/><path d="M9.4 13.6a2.7 2.7 0 0 0 2.7 2.7" opacity=".7"/></svg>
    <span>换水</span>
  </button>
  <button class="btn" data-act="add" aria-label="放鱼">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M3.4 12c3.2-4.2 8.6-4.2 11.8 0-3.2 4.2-8.6 4.2-11.8 0z"/><path d="M15.2 12l4.4-3.2v6.4L15.2 12z"/><circle cx="7.2" cy="11" r=".9" fill="currentColor" stroke="none"/></svg>
    <span>放鱼 · 选品种</span>
  </button>
</div>

<script>
window.onerror = function(m, src, l, c){ document.title = 'ERR ' + m + ' @' + l + ':' + c; return false; };
(function(){
'use strict';

/* ============================================================ 工具 */
var TAU = Math.PI * 2;
function rnd(a, b){ return a + Math.random() * (b - a); }
function ri(a, b){ return Math.floor(rnd(a, b + 1)); }
function pick(a){ return a[(Math.random() * a.length) | 0]; }
function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }
function lerp(a, b, t){ return a + (b - a) * t; }
function smooth(e0, e1, x){ var t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); }
function dist2(a, b, c, d){ var dx = a - c, dy = b - d; return dx * dx + dy * dy; }

var Q = location.search;
var WALL = Q.indexOf('wallpaper') >= 0;
if (WALL) { document.title = 'AQUARIUM_WALL_LAYER'; }  /* 壁纸层唯一标记，供宿主程序识别 */
if (WALL) document.body.classList.add('wall');

window.addEventListener('error', function(e){ document.title = 'ERR ' + e.message + ' @' + (e.lineno || '?'); });
var cv = document.getElementById('tank');
var ctx = cv.getContext('2d', { alpha: false });
var bgc = document.createElement('canvas');
var bgx = bgc.getContext('2d');
var fxc = document.createElement('canvas');
var fxx = fxc.getContext('2d');

var W = 0, H = 0, DPR = 1, VH = 0, sandY = 0, time = 0;

/* ---- 真实贴图（从参考实拍照片提取） ---- */
var SPR = {};
var SPR_FACE = { fishA: 1, fishB: 1, fishC: -1 };   /* 1=头朝右  -1=头朝左 */
var fishReady = 0;

/* ---- 载入时统一做一次"水质化"：去掉照片锐度与湿身反光 ---- */
var SOFT = {};
/* ---- 载入时做一次"水下化"：只羽化边缘、去湿身高光，保留鱼体细节 ---- */
var SOFT = {};
function softenSprite(img){
  var w = img.width || 1, h = img.height || 1;
  var c = document.createElement('canvas');
  c.width = w; c.height = h;
  var g = c.getContext('2d');
  g.drawImage(img, 0, 0);
  var id;
  try { id = g.getImageData(0, 0, w, h); } catch (e){
    /* file:// 未开 --allow-file-access-from-files 时取不到像素，做一次轻度柔化兜底 */
    var c2 = document.createElement('canvas');
    c2.width = w; c2.height = h;
    var g2 = c2.getContext('2d');
    g2.filter = 'blur(0.9px)';
    g2.drawImage(img, 0, 0);
    return c2;
  }
  var d = id.data, n = d.length, i, x, y, k;

  /* 1) 提取 alpha 并做两遍盒式模糊，得到柔和的边缘遮罩 */
  var a0 = new Float32Array(n >> 2);
  for (i = 0; i < n; i += 4) a0[i >> 2] = d[i + 3] / 255;
  var a1 = new Float32Array(n >> 2);
  var r = 2;
  for (var pass = 0; pass < 2; pass++){
    for (y = 0; y < h; y++){
      for (x = 0; x < w; x++){
        var s = 0, q = 0;
        for (var ox = -r; ox <= r; ox++){
          var xx = x + ox;
          if (xx < 0 || xx >= w) continue;
          s += a0[y * w + xx]; q++;
        }
        a1[y * w + x] = s / q;
      }
    }
    for (y = 0; y < h; y++){
      for (x = 0; x < w; x++){
        var s2 = 0, q2 = 0;
        for (var oy = -r; oy <= r; oy++){
          var yy = y + oy;
          if (yy < 0 || yy >= h) continue;
          s2 += a1[yy * w + x]; q2++;
        }
        a0[y * w + x] = s2 / q2;
      }
    }
  }

  /* 2) 体色均值，用于压制高光与边缘杂色 */
  var sr = 0, sg = 0, sb = 0, cnt = 0;
  for (i = 0; i < n; i += 4){
    if (d[i + 3] > 150){ sr += d[i]; sg += d[i + 1]; sb += d[i + 2]; cnt++; }
  }
  if (!cnt) return c;
  sr /= cnt; sg /= cnt; sb /= cnt;

  var lum, sat, mx, mn, mm, rr, gg, bb, al;
  for (i = 0; i < n; i += 4){
    al = a0[i >> 2];
    if (al < 0.01){ d[i + 3] = 0; continue; }
    rr = d[i]; gg = d[i + 1]; bb = d[i + 2];
    mx = rr > gg ? (rr > bb ? rr : bb) : (gg > bb ? gg : bb);
    mn = rr < gg ? (rr < bb ? rr : bb) : (gg < bb ? gg : bb);
    lum = 0.299 * rr + 0.587 * gg + 0.114 * bb;
    sat = mx > 0 ? (mx - mn) / mx : 0;
    /* 湿身反光：高亮低饱和压回体色，这是"照片感"的最大来源 */
    if (lum > 200 && sat < 0.20){
      k = 0.18;
      rr += (sr - rr) * k; gg += (sg - gg) * k; bb += (sb - bb) * k;
      rr *= 0.93; gg *= 0.93; bb *= 0.93;
    }
    /* 边缘去色晕：半透明像素往体色靠，消掉白边 */
    if (al < 0.92){
      k = (1 - al) * 0.75;
      rr += (sr - rr) * k; gg += (sg - gg) * k; bb += (sb - bb) * k;
    }
    /* 轻微去饱和并向水色偏蓝，融入环境光 */
    mm = (rr + gg + bb) / 3;
    rr = rr * 0.97 + mm * 0.03;
    gg = gg * 0.97 + mm * 0.03;
    bb = bb * 0.97 + mm * 0.03 + 3;
    d[i] = rr < 0 ? 0 : rr;
    d[i + 1] = gg < 0 ? 0 : gg;
    d[i + 2] = bb < 0 ? 0 : bb;
    d[i + 3] = al * 255;
  }
  g.putImageData(id, 0, 0);
  return c;
}
function shrinkSprite(c, maxW){
  if (!c || !c.width || c.width <= maxW) return c;
  var nc = document.createElement('canvas');
  nc.width = maxW;
  nc.height = Math.max(1, Math.round(c.height * maxW / c.width));
  var x = nc.getContext('2d');
  x.imageSmoothingEnabled = true;
  if ('imageSmoothingQuality' in x) x.imageSmoothingQuality = 'high';
  x.drawImage(c, 0, 0, nc.width, nc.height);
  return nc;
}
function blurSprite(c, px){
  var o = document.createElement('canvas');
  o.width = c.width; o.height = c.height;
  var x = o.getContext('2d');
  x.filter = 'blur(' + px + 'px)';
  x.drawImage(c, 0, 0);
  return o;
}
function loadSprite(id, url){
  var img = new Image();
  img.onload = function(){
    if (id.indexOf('w') === 0){
      var c0 = shrinkSprite(softenSprite(img), 620);
      SPR[id] = c0;
      SPR[id + '_b1'] = blurSprite(c0, 1.6);
      SPR[id + '_b2'] = blurSprite(c0, 3.4);
    } else {
      SPR[id] = img;
    }
    if (id === 'bg' && W > 0) buildBackground();
    if (id.indexOf('w') === 0){ fishReady++; if (fishReady >= FSPR.length) buildSpecies(); }
  };
  img.src = url;
}
var FSPR = ['w0', 'w1', 'w2', 'w3', 'w4', 'w5', 'w6', 'w7', 'w8'];
loadSprite('bg', 'sprites/bg_forest.jpg');
for (var fi = 0; fi < FSPR.length; fi++) loadSprite(FSPR[fi], 'sprites/' + FSPR[fi] + '.png');

function tintSprite(img, filter){
  var c = document.createElement('canvas');
  c.width = img.width; c.height = img.height;
  var x = c.getContext('2d');
  x.filter = filter;
  x.drawImage(img, 0, 0);
  return c;
}

/* ============================================================ 鱼种（10 种常见观赏鱼配色） */
var PHOTO = true;
var FISH_DEFS = [
  { n: '琉金金鱼',   spr: 'w0', len: [104, 128] },
  { n: '红琉金',     spr: 'w1', len: [96, 118] },
  { n: '七彩神仙',   spr: 'w2', len: [96, 118] },
  { n: '小丑鱼',     spr: 'w3', len: [78, 96] },
  { n: '黄高鳍',     spr: 'w4', len: [92, 112] },
  { n: '蓝宝石鱼',   spr: 'w5', len: [88, 108] },
  { n: '虎皮鱼',     spr: 'w6', len: [76, 94] },
  { n: '红鳍笛鲷',   spr: 'w7', len: [100, 124] },
  { n: '紫红笛鲷',   spr: 'w8', len: [92, 114] }
];

var SPECIES = [];
function speciesById(id){ for (var i = 0; i < SPECIES.length; i++) if (SPECIES[i].id === id) return SPECIES[i]; return SPECIES[0] || null; }

var FACE = { w0: 1, w1: 1, w2: 1, w3: 1, w4: 1, w5: 1, w6: 1, w7: 1, w8: 1 };
function buildSpecies(){
  if (!SPR[FSPR[0]] || SPECIES.length) return;
  for (var i = 0; i < FISH_DEFS.length; i++){
    var d = FISH_DEFS[i];
    SPECIES.push({ id: d.spr, name: d.n, spr: d.spr, face: FACE[d.spr] || 1,
      len: d.len, depth: [0.15, 0.60], swim: [0.85, 1.25], wave: 1 });
  }
  if (W > 0) seedFish();
  buildPicker();
}

/* ============================================================ 状态 */
var S = {
  fish: [], food: [], bubbles: [], motes: [], sparks: [], ripples: [],
  plants: [], front: [], rocks: [], pebbles: [],
  pointer: { x: -9999, y: -9999, px: -9999, py: -9999, t: -9, speed: 0, hover: 0 },
  murk: 0, hudT: 0
};
var KEY = 'aquarium.v8';
var SHOWCASE = false, STILL = false;

/* ============================================================ 背景 */
function buildPhotoBg(){
  if (!SPR.bg) return;
  var tw = SPR.bg.width, th = SPR.bg.height;
  var sc = Math.max(W / tw, H / th);
  var dw = tw * sc, dh = th * sc;
  bgx.setTransform(1, 0, 0, 1, 0, 0);
  bgx.clearRect(0, 0, bgc.width, bgc.height);
  bgx.setTransform(DPR, 0, 0, DPR, 0, 0);
  bgx.drawImage(SPR.bg, (W - dw) / 2, (H - dh) / 2 - H * 0.03, dw, dh);
  var gg = bgx.createLinearGradient(0, 0, 0, H);
  gg.addColorStop(0.00, 'rgba(70,170,180,0.26)');
  gg.addColorStop(0.42, 'rgba(16,64,74,0.16)');
  gg.addColorStop(1.00, 'rgba(2,14,20,0.46)');
  bgx.fillStyle = gg;
  bgx.fillRect(0, 0, W, H);
  var vv = bgx.createRadialGradient(W * 0.5, H * 0.44, Math.min(W, H) * 0.22, W * 0.5, H * 0.5, Math.max(W, H) * 0.76);
  vv.addColorStop(0, 'rgba(0,0,0,0)');
  vv.addColorStop(1, 'rgba(0,10,14,0.52)');
  bgx.fillStyle = vv;
  bgx.fillRect(0, 0, W, H);
  S.sandFront = null;
}
function buildBackground(){
  if (PHOTO && SPR.bg){ buildPhotoBg(); return; }
  bgc.width = Math.max(1, Math.floor(W * DPR));
  bgc.height = Math.max(1, Math.floor(H * DPR));
  bgx.setTransform(DPR, 0, 0, DPR, 0, 0);
  bgx.clearRect(0, 0, W, H);

  /* 水体：上浅下深，接近实拍的深青 */
  var g = bgx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0.00, '#0a3b46');
  g.addColorStop(0.16, '#082a33');
  g.addColorStop(0.42, '#051c24');
  g.addColorStop(0.72, '#031218');
  g.addColorStop(1.00, '#01090c');
  bgx.fillStyle = g;
  bgx.fillRect(0, 0, W, H);

  /* 顶部主光 */
  var g2 = bgx.createRadialGradient(W * 0.46, -H * 0.16, 0, W * 0.46, -H * 0.16, H * 1.15);
  g2.addColorStop(0, 'rgba(170,240,235,0.20)');
  g2.addColorStop(0.34, 'rgba(60,160,165,0.055)');
  g2.addColorStop(1, 'rgba(0,0,0,0)');
  bgx.fillStyle = g2;
  bgx.fillRect(0, 0, W, H);

  /* 远处水草剪影（很淡） */
  bgx.save();
  bgx.filter = 'blur(9px)';
  bgx.globalAlpha = 0.30;
  for (var i = 0; i < 12; i++){
    silPlant(bgx, rnd(-40, W + 40), sandY + rnd(-10, 20), rnd(H * 0.1, H * 0.34), 'rgba(6,40,38,0.95)');
  }
  bgx.restore();

  buildSubstrate(bgx);
}

function silPlant(c, x0, baseY, len, color){
  c.strokeStyle = color;
  c.lineCap = 'round';
  var n = 3 + ri(0, 3);
  for (var b = 0; b < n; b++){
    var lean = rnd(-0.55, 0.55);
    var L2 = len * rnd(0.45, 1);
    c.beginPath();
    c.moveTo(x0 + rnd(-16, 16), baseY);
    c.quadraticCurveTo(x0 + lean * L2 * 0.4, baseY - L2 * 0.6, x0 + lean * L2, baseY - L2);
    c.lineWidth = rnd(2.5, 7);
    c.stroke();
  }
}

/* ---------- 石头 ---------- */
function buildRocks(c){
  S.rocks = [
    { x: W * 0.075, y: sandY + 26, w: W * 0.075, h: H * 0.058 },
    { x: W * 0.155, y: sandY + 40, w: W * 0.042, h: H * 0.036 },
    { x: W * 0.935, y: sandY + 30, w: W * 0.070, h: H * 0.050 }
  ];
  for (var i = 0; i < S.rocks.length; i++){
    var r = S.rocks[i], rw = r.w, rh = r.h;
    c.save();
    var sh = c.createRadialGradient(r.x, r.y + rh * 0.4, 0, r.x, r.y + rh * 0.4, rw * 1.4);
    sh.addColorStop(0, 'rgba(0,0,0,0.55)');
    sh.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = sh;
    c.beginPath();
    c.ellipse(r.x, r.y + rh * 0.5, rw * 1.2, rh * 0.36, 0, 0, TAU);
    c.fill();
    c.restore();

    var gd = c.createLinearGradient(r.x - rw * 0.7, r.y - rh * 1.2, r.x + rw * 0.8, r.y + rh * 0.5);
    gd.addColorStop(0, '#4a5a55');
    gd.addColorStop(0.35, '#2a3a37');
    gd.addColorStop(1, '#0d1718');
    c.fillStyle = gd;
    c.beginPath();
    c.moveTo(r.x - rw, r.y + rh * 0.25);
    c.bezierCurveTo(r.x - rw * 1.05, r.y - rh * 0.9, r.x - rw * 0.35, r.y - rh * 1.3, r.x + rw * 0.1, r.y - rh * 1.15);
    c.bezierCurveTo(r.x + rw * 0.7, r.y - rh * 1.0, r.x + rw * 1.05, r.y - rh * 0.55, r.x + rw, r.y + rh * 0.25);
    c.bezierCurveTo(r.x + rw * 0.4, r.y + rh * 0.45, r.x - rw * 0.5, r.y + rh * 0.45, r.x - rw, r.y + rh * 0.25);
    c.closePath();
    c.fill();

    c.save();
    c.clip();
    for (var m = 0; m < 5; m++){
      c.beginPath();
      c.ellipse(r.x + rnd(-rw * 0.8, rw * 0.8), r.y - rh * rnd(0.4, 1.05),
                rnd(rw * 0.15, rw * 0.4), rnd(4, 12), rnd(-0.4, 0.4), 0, TAU);
      c.fillStyle = 'rgba(70,130,95,0.16)';
      c.fill();
    }
    c.beginPath();
    c.ellipse(r.x - rw * 0.15, r.y - rh * 1.05, rw * 0.5, rh * 0.22, -0.15, 0, TAU);
    c.fillStyle = 'rgba(190,225,215,0.16)';
    c.fill();
    c.restore();
  }
}

/* ---------- 彩色鹅卵石床 ---------- */
var PEBBLE_ZONES = [
  [['#f2ecda', '#cfc5a8'], ['#f7f3e6', '#d8d2bd'], ['#e9dcb4', '#bda877']],
  [['#d8b05a', '#a07d2c'], ['#cb9640', '#8f6624'], ['#c07a38', '#8a511f']],
  [['#35706f', '#1f4745'], ['#275a5f', '#173c40'], ['#4a7f7a', '#2c5651']],
  [['#8e8b78', '#615f52'], ['#b3ae98', '#7d7a68'], ['#6d7a52', '#464f31']]
];

function buildSubstrate(c){
  var depth = H - sandY;

  if (SPR.bed){
    /* 波浪形砂面边界 */
    var waveY = function(x){
      return sandY + Math.sin(x * 0.0052 + 1.1) * 11 + Math.sin(x * 0.0145 - 0.7) * 5;
    };
    var bedPath = function(){
      c.beginPath();
      c.moveTo(-4, H + 4);
      for (var i = 0; i <= 34; i++) c.lineTo(W * i / 34, waveY(W * i / 34));
      c.lineTo(W + 4, H + 4);
      c.closePath();
    };
    c.save();
    bedPath();
    c.clip();

    var bw = W * 1.02;
    var bh = bw * (SPR.bed.height / SPR.bed.width);
    c.drawImage(SPR.bed, -W * 0.01, sandY - 30, bw, bh);
    /* 水下色偏，压掉贴图的高光 */
    var tint = c.createLinearGradient(0, sandY, 0, H);
    tint.addColorStop(0, 'rgba(8,34,42,0.42)');
    tint.addColorStop(0.55, 'rgba(6,26,34,0.24)');
    tint.addColorStop(1, 'rgba(4,18,26,0.12)');
    c.fillStyle = tint;
    c.fillRect(0, sandY - 30, W, H);

    /* 水线以下的阴影，让砂面"沉"在水里 */
    var ft = c.createLinearGradient(0, sandY - 26, 0, sandY + 90);
    ft.addColorStop(0, 'rgba(3,17,23,0.92)');
    ft.addColorStop(0.42, 'rgba(3,17,23,0.46)');
    ft.addColorStop(1, 'rgba(3,17,23,0)');
    c.fillStyle = ft;
    c.fillRect(0, sandY - 30, W, 130);

    /* 靠近镜头压暗 */
    var fb = c.createLinearGradient(0, H - depth * 0.42, 0, H);
    fb.addColorStop(0, 'rgba(0,3,5,0)');
    fb.addColorStop(1, 'rgba(0,3,5,0.58)');
    c.fillStyle = fb;
    c.fillRect(0, H - depth * 0.42, W, depth * 0.42 + 2);
    c.restore();
    return;
  }

  /* 深色底衬 */
  var base = c.createLinearGradient(0, sandY - 10, 0, H);
  base.addColorStop(0, '#1b2b28');
  base.addColorStop(0.35, '#101d1c');
  base.addColorStop(1, '#050b0c');
  c.fillStyle = base;
  c.fillRect(0, sandY - 10, W, depth + 12);

  /* 远景石床：整体偏暗偏蓝，做出纵深 */
  var rowN = 26;
  for (var r = 0; r < rowN; r++){
    var t = r / (rowN - 1);
    var y = sandY + Math.pow(t, 1.55) * (depth + 8);
    var rad = lerp(3.4, 11.5, Math.pow(t, 0.75)) * (W / 1536);
    var dim = lerp(0.46, 1.0, Math.pow(t, 0.6));
    var x = -rad * 2 + rnd(-rad, rad);
    while (x < W + rad * 2){
      /* 低频扰动让同类石子在局部聚成小片，像真实缸底 */
      var nz = Math.sin(x * 0.0021 + r * 0.55) + Math.sin(x * 0.0063 - r * 0.31);
      var z = nz > 0.55 ? 2 : nz > -0.15 ? 0 : nz > -0.85 ? 1 : 3;
      var pal = PEBBLE_ZONES[z][(Math.random() * 3) | 0];
      drawPebble(c, x, y + rnd(-rad * 0.95, rad * 0.95), rad * rnd(0.72, 1.18), dim, pal);
      x += rad * rnd(0.95, 1.55);
    }
  }

  /* 随机补一层，打散行感 */
  for (var q2 = 0; q2 < 900; q2++){
    var qy = sandY + Math.pow(Math.random(), 1.5) * (depth + 6);
    var qq = 1 - (qy - sandY) / (depth + 6);
    var qr = lerp(2.8, 10, qq) * (W / 1536) * rnd(0.6, 1.1);
    drawPebble(c, rnd(-10, W + 10), qy, qr, lerp(0.46, 1, qq), pick(pick(PEBBLE_ZONES)));
  }

  /* 边界处露出的几颗大石子，打破直线 */
  for (var e = 0; e < 22; e++){
    var ex = rnd(-10, W + 10);
    var er = rnd(5, 13) * (W / 1536);
    drawPebble(c, ex, sandY - rnd(0, er * 0.8), er, 1.0, pick(pick(PEBBLE_ZONES)));
  }

  /* 石床顶部的一层光（水中散射） */
  var top = c.createLinearGradient(0, sandY - 6, 0, sandY + depth * 0.42);
  top.addColorStop(0, 'rgba(150,220,210,0.16)');
  top.addColorStop(1, 'rgba(150,220,210,0)');
  c.fillStyle = top;
  c.fillRect(0, sandY - 6, W, depth * 0.45);

  /* 靠近镜头处压暗（景深） */
  var btm = c.createLinearGradient(0, H - depth * 0.30, 0, H);
  btm.addColorStop(0, 'rgba(0,0,0,0)');
  btm.addColorStop(1, 'rgba(0,4,6,0.62)');
  c.fillStyle = btm;
  c.fillRect(0, H - depth * 0.30, W, depth * 0.30 + 2);
}

function drawPebble(c, x, y, r, dim, pal){
  var ry = r * rnd(0.60, 0.80);
  var rot = rnd(-0.5, 0.5);

  /* 石缝阴影 */
  c.beginPath();
  c.ellipse(x, y + ry * 0.5, r * 1.06, ry * 0.62, rot, 0, TAU);
  c.fillStyle = 'rgba(0,0,0,' + (0.30 * dim) + ')';
  c.fill();

  var g = c.createRadialGradient(x - r * 0.34, y - ry * 0.5, r * 0.06, x, y, r * 1.16);
  g.addColorStop(0, hexA(pal[0], 0.20 + 0.80 * dim));
  g.addColorStop(0.55, hexA(pal[1], 0.24 + 0.76 * dim));
  g.addColorStop(1, hexA('#000000', 0.42));
  c.beginPath();
  c.ellipse(x, y, r, ry, rot, 0, TAU);
  c.fillStyle = g;
  c.fill();

  /* 高光点 + 上缘反光 */
  if (r > 2.6){
    c.beginPath();
    c.ellipse(x - r * 0.32, y - ry * 0.44, r * 0.26, ry * 0.20, rot, 0, TAU);
    c.fillStyle = 'rgba(255,255,250,' + (0.34 * dim) + ')';
    c.fill();
    c.beginPath();
    c.ellipse(x, y + ry * 0.62, r * 0.86, ry * 0.22, rot, 0, TAU);
    c.fillStyle = 'rgba(0,0,0,' + (0.28 * dim) + ')';
    c.fill();
  }
}

function hexA2(hex){
  var n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function hexA(hex, a){
  var n = parseInt(hex.slice(1), 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a.toFixed(3) + ')';
}
function hexA2(hex){
  var n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function hexAMix(a, b, t, alpha){
  var ca = hexA2(a), cb = hexA2(b);
  var r = Math.round(ca[0] + (cb[0] - ca[0]) * t);
  var g = Math.round(ca[1] + (cb[1] - ca[1]) * t);
  var bl = Math.round(ca[2] + (cb[2] - ca[2]) * t);
  return 'rgba(' + r + ',' + g + ',' + bl + ',' + (alpha === undefined ? 1 : alpha).toFixed(3) + ')';
}

/* ============================================================ 水草 */
function makePlant(x, hf, kind){
  return {
    x: x, h: VH * hf, kind: kind || 'grass',
    ph: rnd(0, TAU), sw: rnd(0.35, 0.8),
    blades: kind === 'grass' ? ri(9, 15) : kind === 'rosette' ? ri(7, 11) : ri(5, 8),
    seed: rnd(0, 100)
  };
}

function buildPlants(){
  if (PHOTO){ S.plants = []; S.front = []; return; }
  S.plants = [];
  S.front = [];
  if (SPR.plantR){
    var ar = SPR.plantR.height / SPR.plantR.width;
    S.plants.push({ spr: 'plantR', x: W * 0.90, h: VH * 0.52, ar: ar, flip: false, a: 1, kind: 'spr' });
    S.plants.push({ spr: 'plantR', x: W * 0.115, h: VH * 0.44, ar: ar, flip: true, a: 0.92, kind: 'spr' });
    S.plants.push({ spr: 'plantR', x: W * 0.74, h: VH * 0.30, ar: ar, flip: true, a: 0.55, kind: 'spr' });
    S.plants.push({ spr: 'plantR', x: W *0.34, h: VH * 0.22, ar: ar, flip: false, a: 0.40, kind: 'spr' });
    S.front = [];
    return;
  }

  /* 左侧：一丛宽叶绿植（像参考图左上角） */
  S.plants.push(makePlant(W * 0.045, 0.42, 'rosette'));
  S.plants.push(makePlant(W * 0.105, 0.30, 'rosette'));

  /* 右侧：高细叶草 */
  S.plants.push(makePlant(W * 0.845, 0.52, 'grass'));
  S.plants.push(makePlant(W * 0.905, 0.40, 'grass'));
  S.plants.push(makePlant(W * 0.965, 0.30, 'grass'));

  /* 中景散落 */
  var n = Math.max(3, Math.round(W / 420));
  for (var i = 0; i < n; i++){
    S.plants.push(makePlant(W * rnd(0.18, 0.82), rnd(0.12, 0.26), Math.random() < 0.22 ? 'red' : 'grass'));
  }

  /* 前景：压暗、虚化，拉出纵深 */
  S.front.push(makePlant(W * 0.015, 0.34, 'grass'));
  S.front.push(makePlant(W * 0.995, 0.40, 'grass'));
}

function drawPlant(p, t, isFront){
  if (p.kind === 'spr'){
    var img = SPR[p.spr];
    if (!img) return;
    var hh = p.h, ww = hh / p.ar;
    var sway = Math.sin(t * 0.55 + p.x * 0.01) * hh * 0.012;
    ctx.save();
    ctx.globalAlpha = p.a;
    if (isFront) ctx.filter = 'blur(2px)';
    ctx.translate(p.x + sway, sandY + hh * 0.13);
    if (p.flip) ctx.scale(-1, 1);
    ctx.drawImage(img, -ww / 2, -hh, ww, hh);
    if (isFront) ctx.filter = 'none';
    ctx.restore();
    return;
  }
  if (p.kind === 'rosette' || p.kind === 'red') return drawRosette(p, t, isFront, p.kind === 'red');
  return drawBlades(p, t, isFront, false);
}


function drawBlades(p, t, isFront, red){
  var baseY = sandY + (isFront ? 26 : 8);
  for (var b = 0; b < p.blades; b++){
    var seed = p.seed + b * 2.13;
    var len = p.h * (0.42 + 0.58 * ((Math.sin(seed * 3.7) + 1) / 2));
    var lean = Math.sin(seed * 5.1) * 0.5;
    var x0 = p.x + Math.sin(seed) * 30;
    var w = (isFront ? 6.4 : 3.2) + (b % 3) * 1.5;
    var seg = 12, pts = [];
    for (var i = 0; i <= seg; i++){
      var tt = i / seg;
      var sway = Math.sin(t * p.sw + seed + tt * 1.6) * (isFront ? 0.06 : 0.12) * len * tt * tt;
      pts.push({ x: x0 + lean * len * tt + sway, y: baseY - len * tt });
    }
    var left = [], right = [];
    for (var q = 0; q <= seg; q++){
      var tq = q / seg;
      var hw = w * Math.pow(Math.sin(Math.PI * (0.22 + 0.78 * tq)), 0.75) * (1 - 0.55 * tq);
      var nx = pts[Math.min(seg, q + 1)], pv = pts[Math.max(0, q - 1)];
      var dx = nx.x - pv.x, dy = nx.y - pv.y;
      var dl = Math.sqrt(dx * dx + dy * dy) || 1;
      left.push({ x: pts[q].x - dy / dl * hw, y: pts[q].y + dx / dl * hw });
      right.push({ x: pts[q].x + dy / dl * hw, y: pts[q].y - dx / dl * hw });
    }
    var hue = 92 + ((b * 7) % 16) - 8;
    var sat = isFront ? 46 : 68;
    var lit = isFront ? 13 : 32;
    var grd = ctx.createLinearGradient(x0, baseY, pts[seg].x, pts[seg].y);
    grd.addColorStop(0, 'hsl(' + hue + ',' + (sat * 0.8) + '%,' + (lit * 0.40) + '%)');
    grd.addColorStop(0.45, 'hsl(' + hue + ',' + sat + '%,' + lit + '%)');
    grd.addColorStop(1, 'hsl(' + (hue + 8) + ',' + (sat * 0.95) + '%,' + Math.min(96, lit * 1.62) + '%)');
    ctx.beginPath();
    ctx.moveTo(left[0].x, left[0].y);
    for (var a = 1; a <= seg; a++) ctx.lineTo(left[a].x, left[a].y);
    for (var c2 = seg; c2 >= 0; c2--) ctx.lineTo(right[c2].x, right[c2].y);
    ctx.closePath();
    ctx.fillStyle = grd;
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (var a2 = 1; a2 <= seg; a2++) ctx.lineTo(pts[a2].x, pts[a2].y);
    ctx.strokeStyle = 'hsla(' + (hue + 6) + ',60%,' + Math.min(92, lit * 2.0) + '%,0.26)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
}

function drawRosette(p, t, isFront, red){
  var baseY = sandY + (isFront ? 26 : 10);
  /* 背后的暗叶，做出层次 */
  for (var b = p.blades - 1; b >= 0; b--){
    drawRosetteLeaf(p, t, isFront, red, b, true);
  }
  for (var b2 = 0; b2 < p.blades; b2++){
    drawRosetteLeaf(p, t, isFront, red, b2, false);
  }
}

function drawRosetteLeaf(p, t, isFront, red, b, back){
  var baseY = sandY + (isFront ? 26 : 10);
  var seed = p.seed + b * 1.87;
  var ang = -1.95 + (b / Math.max(1, p.blades - 1)) * 3.0 + Math.sin(seed) * 0.16;
  var len = p.h * (0.70 + 0.30 * Math.sin(seed * 2.3)) * (back ? 0.86 : 1);
  var sway = Math.sin(t * p.sw * 0.8 + seed) * 5;
  var x0 = p.x + Math.sin(seed * 1.3) * 20;
  var tipX = x0 + Math.cos(ang) * len + sway;
  var tipY = baseY + Math.sin(ang) * len;
  var cxp = x0 + Math.cos(ang) * len * 0.52 + sway * 0.4;
  var cyp = baseY + Math.sin(ang) * len * 0.52 - len * 0.16;
  var wl = len * (back ? 0.115 : 0.150), wr = len * (back ? 0.115 : 0.132);

  var nx = -(tipY - cyp), ny = (tipX - cxp);
  var nl = Math.sqrt(nx * nx + ny * ny) || 1;
  nx /= nl; ny /= nl;

  ctx.beginPath();
  ctx.moveTo(x0 - nx * wl * 0.22, baseY - ny * wl * 0.22);
  ctx.quadraticCurveTo(cxp - nx * wl, cyp - ny * wl, tipX, tipY);
  ctx.quadraticCurveTo(cxp + nx * wr, cyp + ny * wr, x0 + nx * wr * 0.22, baseY + ny * wr * 0.22);
  ctx.closePath();

  var hue = (red ? 5 : 90) + ((b * 5) % 18);
  var lit = isFront ? 15 : (red ? 19 + (b % 3) * 4 : 24 + (b % 3) * 6);
  if (back) lit *= 0.48;
  var grd = ctx.createLinearGradient(x0, baseY, tipX, tipY);
  grd.addColorStop(0, 'hsl(' + hue + ',60%,' + (lit * 0.40) + '%)');
  grd.addColorStop(0.5, 'hsl(' + (hue + 6) + ',66%,' + lit + '%)');
  grd.addColorStop(1, 'hsl(' + (hue + 14) + ',72%,' + Math.min(90, lit * 1.72) + '%)');
  ctx.fillStyle = grd;
  ctx.fill();
  ctx.strokeStyle = 'hsla(' + (hue - 6) + ',52%,' + (lit * 0.22) + '%,0.42)';
  ctx.lineWidth = 0.9;
  ctx.stroke();

  if (!back){
    ctx.beginPath();
    ctx.moveTo(x0, baseY);
    ctx.quadraticCurveTo(cxp, cyp, tipX, tipY);
    ctx.strokeStyle = 'hsla(' + (hue + 10) + ',74%,' + Math.min(90, lit * 2.25) + '%,0.42)';
    ctx.lineWidth = 1.3;
    ctx.stroke();
    /* 侧脉 */
    for (var v = 1; v <= 3; v++){
      var vv = v / 4.2;
      var vx = x0 + (cxp - x0) * vv * 1.5, vy = baseY + (cyp - baseY) * vv * 1.5;
      ctx.beginPath();
      ctx.moveTo(vx, vy);
      ctx.lineTo(x0 + (tipX - x0) * vv + nx * wl * 0.5, baseY + (tipY - baseY) * vv + ny * wl * 0.5);
      ctx.strokeStyle = 'hsla(' + (hue + 8) + ',66%,' + Math.min(86, lit * 1.9) + '%,0.20)';
      ctx.lineWidth = 0.8;
      ctx.stroke();
    }
  }
}

/* ============================================================ 鱼 */
function bodyW(u){
  var a = smooth(0.0, 0.15, u);
  var b = 1 - smooth(0.62, 1.0, u);
  return Math.pow(a, 0.32) * Math.pow(b, 1.25);
}

function makeFish(sp, len, x, y, fullness){
  var L = len || rnd(sp.len[0], sp.len[1]) * clamp(W / 1536, 0.70, 1.5);
  L = clamp(L, sp.len[0] * 0.62 * clamp(W / 1536, 0.7, 1.5), sp.len[1] * 1.12 * clamp(W / 1536, 0.7, 1.5));
  return {
    sp: sp, len: L,
    x: x !== undefined ? x : rnd(W * 0.12, W * 0.88),
    y: y !== undefined ? y : rnd(H * sp.depth[0], sandY - L * 0.5),
    angle: Math.random() < 0.5 ? rnd(-0.2, 0.2) + Math.PI : rnd(-0.2, 0.2),
    speed: L * rnd(sp.swim[0], sp.swim[1]) * 1.12,
    cruise: 1, bob: rnd(0, TAU), roll: 0, ang: 0, v: 0, hover: 0, turn: 0,
    dir: Math.random() < 0.5 ? -1 : 1, pitch: 0, vx: 0, vy: 0, turnT: 0, turnDur: rnd(0.85, 1.35), hoverT: 0, s1: rnd(0, TAU), s2: rnd(0, TAU), s3: rnd(0, TAU),
    bend: 0, bendT: 0, waveAmp: 0.045, waveHz: 1.5, wave0: rnd(0, TAU),
    phase: rnd(0, TAU), beat: rnd(0, TAU),
    tx: 0, ty: 0, retarget: 0,
    fullness: fullness !== undefined ? fullness : rnd(0.45, 0.9),
    excitation: 0
  };
  f.ang = f.angle; f.v = f.speed * 0.8;
  return f;
}

function drawFish(f, t){
  var img = SPR[f.sp.spr];
  if (img){
    drawSpriteFish(f, t, img);
  }
  return;
  /* 贴图缺失时的矢量兜底已停用 */
  var sp = f.sp, L = f.len, Hh = L * sp.hgt * 0.44;
  var N = 26, top = [], bot = [], mid = [], i, u, wv, x;

  ctx.save();
  ctx.translate(f.x, f.y);
  ctx.rotate(f.angle);

  var swim = t * f.speed * 3.4 + f.beat;
  var amp = L * 0.052 * sp.wave * (1 + f.excitation * 0.9);

  for (i = 0; i <= N; i++){
    u = i / N;
    wv = (Math.sin(u * 4.1 - swim) * 0.8 + Math.sin(u * 7.6 - swim * 1.3) * 0.2) * Math.pow(u, 1.9) * amp;
    x = (0.5 - u) * L;
    var bw = bodyW(u);
    top.push({ x: x, y: wv - Hh * sp.topK * bw });
    bot.push({ x: x, y: wv + Hh * sp.botK * bw });
    mid.push({ x: x, y: wv });
  }
  var tailAng = Math.atan2(mid[N].y - mid[N - 4].y, mid[N].x - mid[N - 4].x);
  var pedH = Hh * 0.62;

  /* 尾鳍 */
  ctx.save();
  ctx.translate(mid[N].x, mid[N].y);
  ctx.rotate(tailAng - Math.PI);
  var TL = L * 0.30 * sp.tail;
  var finSoft = hexAMix(sp.light, '#ffe8d2', 0.35, 0.50);
  var gr = ctx.createLinearGradient(0, 0, -TL, 0);
  gr.addColorStop(0, hexAMix(sp.light, '#ffffff', 0.20, 0.60));
  gr.addColorStop(0.42, finSoft);
  gr.addColorStop(0.86, finSoft);
  gr.addColorStop(1, hexA(sp.belly, 0.10));
  ctx.fillStyle = gr;
  ctx.beginPath();
  ctx.moveTo(L * 0.05, -pedH * 0.78);
  ctx.bezierCurveTo(-TL * 0.26, -pedH * 2.05, -TL * 0.92, -TL * 0.72, -TL * 0.86, -TL * 0.26);
  ctx.quadraticCurveTo(-TL * 0.52, -TL * 0.04, -TL * 0.86, TL * 0.26);
  ctx.bezierCurveTo(-TL * 0.92, TL * 0.72, -TL * 0.26, pedH * 2.05, L * 0.05, pedH * 0.78);
  ctx.closePath();
  ctx.fill();

  /* 鳍条 */
  ctx.strokeStyle = 'rgba(255,255,255,0.13)';
  ctx.lineWidth = 0.85;
  for (var tr = -4; tr <= 4; tr++){
    ctx.beginPath();
    ctx.moveTo(L * 0.02, tr * pedH * 0.15);
    ctx.quadraticCurveTo(-TL * 0.48, tr * pedH * 0.42, -TL * 0.93, tr * TL * 0.135);
    ctx.stroke();
  }
  /* 尾鳍末端的亮边 */
  ctx.beginPath();
  ctx.moveTo(-TL * 0.86, -TL * 0.26);
  ctx.quadraticCurveTo(-TL * 0.52, -TL * 0.04, -TL * 0.86, TL * 0.26);
  ctx.strokeStyle = 'rgba(255,240,225,0.22)';
  ctx.lineWidth = 1.2;
  ctx.stroke();
  ctx.restore();

  /* 背鳍 / 臀鳍 */
  var d0 = Math.round(N * 0.40), d1 = Math.round(N * 0.70);
  ctx.beginPath();
  ctx.moveTo(top[d0].x, top[d0].y);
  for (var k = d0 + 1; k <= d1; k++) ctx.lineTo(top[k].x, top[k].y - Hh * 0.40 * bodyW(k / N));
  for (var k2 = d1; k2 >= d0; k2--) ctx.lineTo(top[k2].x, top[k2].y);
  ctx.closePath();
  var dg = ctx.createLinearGradient(0, top[d0].y - Hh * 0.42, 0, top[d0].y);
  dg.addColorStop(0, sp.finTip);
  dg.addColorStop(1, hexAMix(sp.light, '#ffffff', 0.30, 0.62));
  ctx.fillStyle = dg;
  ctx.globalAlpha = 0.72;
  ctx.fill();
  ctx.globalAlpha = 1;

  var a0 = Math.round(N * 0.60), a1 = Math.round(N * 0.80);
  ctx.beginPath();
  ctx.moveTo(bot[a0].x, bot[a0].y);
  for (var m = a0 + 1; m <= a1; m++) ctx.lineTo(bot[m].x, bot[m].y + Hh * 0.26 * bodyW(m / N));
  for (var m2 = a1; m2 >= a0; m2--) ctx.lineTo(bot[m2].x, bot[m2].y);
  ctx.closePath();
  ctx.fillStyle = hexAMix(sp.light, '#ffffff', 0.22, 0.55);
  ctx.globalAlpha = 0.70;
  ctx.fill();
  ctx.globalAlpha = 1;

  /* 身体 */
  ctx.beginPath();
  ctx.moveTo(top[0].x, top[0].y);
  for (i = 1; i <= N; i++) ctx.lineTo(top[i].x, top[i].y);
  for (i = N; i >= 0; i--) ctx.lineTo(bot[i].x, bot[i].y);
  ctx.closePath();

  var bg = ctx.createLinearGradient(0, -Hh * 1.05, 0, Hh * 1.15);
  bg.addColorStop(0.00, sp.dark);
  bg.addColorStop(0.20, sp.base);
  bg.addColorStop(0.48, sp.base);
  bg.addColorStop(0.68, sp.light);
  bg.addColorStop(0.86, sp.belly);
  bg.addColorStop(1.00, sp.belly);
  ctx.fillStyle = bg;
  ctx.fill();

  /* 花纹 */
  ctx.save();
  ctx.clip();
  if (sp.patchA > 0.05){
    for (var p = 0; p < 3; p++){
      var px = L * (0.26 - p * 0.24) + Math.sin(f.phase + p * 2.1) * L * 0.04;
      var py = -Hh * 0.30 + Math.cos(f.phase * 0.7 + p) * Hh * 0.28;
      var pr = L * (0.15 + (p % 2) * 0.06);
      var pg = ctx.createRadialGradient(px, py, 0, px, py, pr);
      pg.addColorStop(0, hexA(sp.patch, sp.patchA));
      pg.addColorStop(0.62, hexA(sp.patch, sp.patchA * 0.5));
      pg.addColorStop(1, hexA(sp.patch, 0));
      ctx.fillStyle = pg;
      ctx.beginPath();
      ctx.ellipse(px, py, pr, pr * 0.70, Math.sin(f.phase + p) * 0.4, 0, TAU);
      ctx.fill();
    }
  }
  var back = ctx.createLinearGradient(0, -Hh * 1.05, 0, -Hh * 0.05);
  back.addColorStop(0, 'rgba(0,0,0,0.46)');
  back.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = back;
  ctx.fillRect(-L, -Hh * 1.2, L * 2, Hh * 1.3);

  var spx = L * 0.06, spy = -Hh * 0.30;
  var sg = ctx.createRadialGradient(spx, spy, 0, spx, spy, L * 0.30);
  sg.addColorStop(0, 'rgba(255,255,255,' + (0.42 * sp.sheen).toFixed(2) + ')');
  sg.addColorStop(0.5, 'rgba(255,255,255,' + (0.10 * sp.sheen).toFixed(2) + ')');
  sg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = sg;
  ctx.beginPath();
  ctx.ellipse(spx, spy, L * 0.30, Hh * 0.40, -0.12, 0, TAU);
  ctx.fill();

  for (var sc = 0; sc < 6; sc++){
    var sx0 = L * (0.26 - sc * 0.085);
    for (var sy = -2; sy <= 2; sy++){
      ctx.beginPath();
      ctx.arc(sx0, sy * Hh * 0.22, Hh * 0.22, -0.85, 0.85);
      ctx.strokeStyle = 'rgba(255,255,255,0.075)';
      ctx.lineWidth = 0.75;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(sx0 - 0.6, sy * Hh * 0.22 + 0.6, Hh * 0.22, -0.85, 0.85);
      ctx.strokeStyle = 'rgba(0,0,0,0.06)';
      ctx.stroke();
    }
  }
  ctx.restore();

  /* 细暗轮廓 */
  ctx.beginPath();
  ctx.moveTo(top[0].x, top[0].y);
  for (i = 1; i <= N; i++) ctx.lineTo(top[i].x, top[i].y);
  for (i = N; i >= 0; i--) ctx.lineTo(bot[i].x, bot[i].y);
  ctx.closePath();
  ctx.strokeStyle = 'rgba(10,4,0,0.20)';
  ctx.lineWidth = Math.max(1, L * 0.012);
  ctx.stroke();

  /* 背脊高光带（湿滑质感） */
  ctx.save();
  ctx.beginPath();
  for (i = 2; i <= Math.round(N * 0.72); i++){
    var hx = top[i].x, hy = top[i].y + Hh * 0.085;
    if (i === 2) ctx.moveTo(hx, hy); else ctx.lineTo(hx, hy);
  }
  ctx.strokeStyle = 'rgba(255,255,255,' + (0.26 * sp.sheen).toFixed(2) + ')';
  ctx.lineWidth = Math.max(1.0, Hh * 0.10);
  ctx.lineCap = 'round';
  ctx.stroke();
  ctx.restore();

  /* 背/腹轮廓光 */
  ctx.beginPath();
  ctx.moveTo(top[0].x, top[0].y);
  for (i = 1; i <= N; i++) ctx.lineTo(top[i].x, top[i].y);
  ctx.strokeStyle = 'rgba(255,255,255,0.17)';
  ctx.lineWidth = Math.max(0.8, L * 0.010);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(bot[2].x, bot[2].y);
  for (i = 3; i <= N; i++) ctx.lineTo(bot[i].x, bot[i].y);
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.lineWidth = Math.max(0.8, L * 0.010);
  ctx.stroke();

  /* 鳃盖 */
  ctx.beginPath();
  ctx.moveTo(L * 0.235, -Hh * 0.62);
  ctx.quadraticCurveTo(L * 0.175, 0, L * 0.245, Hh * 0.64);
  ctx.strokeStyle = 'rgba(0,0,0,0.15)';
  ctx.lineWidth = Math.max(0.8, L * 0.011);
  ctx.stroke();

  /* 嘴 */
  ctx.beginPath();
  ctx.moveTo(L * 0.487, Hh * 0.09);
  ctx.quadraticCurveTo(L * 0.44, Hh * 0.15, L * 0.447, Hh * 0.01);
  ctx.strokeStyle = 'rgba(52,18,8,0.42)';
  ctx.lineWidth = Math.max(0.8, L * 0.011);
  ctx.stroke();

  /* 眼 */
  var ex = L * 0.372, ey = -Hh * 0.15, er = Math.max(1.8, L * 0.034);
  ctx.beginPath();
  ctx.arc(ex, ey, er * 1.55, 0, TAU);
  ctx.fillStyle = 'rgba(255,250,240,0.26)';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(ex, ey, er * 1.28, 0, TAU);
  ctx.strokeStyle = 'rgba(0,0,0,0.22)';
  ctx.lineWidth = Math.max(0.8, er * 0.30);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(ex, ey, er, 0, TAU);
  var eg = ctx.createRadialGradient(ex - er * 0.3, ey - er * 0.3, 0, ex, ey, er);
  eg.addColorStop(0, '#5f564d');
  eg.addColorStop(0.55, sp.eye);
  eg.addColorStop(1, '#000000');
  ctx.fillStyle = eg;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(ex - er * 0.30, ey - er * 0.34, er * 0.36, 0, TAU);
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.fill();

  /* 胸鳍 */
  var flut = Math.sin(t * 6.2 + f.phase) * 0.34;
  ctx.save();
  ctx.translate(L * 0.155, Hh * 0.30);
  ctx.rotate(0.42 + flut);
  var fg = ctx.createLinearGradient(0, 0, -L * 0.22, L * 0.10);
  fg.addColorStop(0, hexAMix(sp.light, '#ffffff', 0.30, 0.62));
  fg.addColorStop(1, sp.finTip);
  ctx.fillStyle = fg;
  ctx.globalAlpha = 0.72;
  ctx.beginPath();
  ctx.ellipse(-L * 0.10, L * 0.02, L * 0.13, L * 0.046, 0, 0, TAU);
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.restore();

  ctx.restore();
}

/* 每帧把鱼画进离屏缓冲，再统一做水色/光照/焦散合成，最后贴回主画布 */
var _spineX = new Float64Array(64), _spineY = new Float64Array(64), _spineA = new Float64Array(64);
var _fbuf = document.createElement('canvas');
_fbuf.width = 420; _fbuf.height = 300;
var _fctx = _fbuf.getContext('2d');

function drawSpriteFish(f, t, img){
  var _zz0 = (typeof f.z === 'number') ? f.z : 0.55;
  var _src = f.sp.spr;
  if (_zz0 < 0.34 && SPR[_src + '_b2']) img = SPR[_src + '_b2'];
  else if (_zz0 < 0.62 && SPR[_src + '_b1']) img = SPR[_src + '_b1'];
  var face = f.sp.face || 1;
  var ex = f.excitation || 0;
  var dep = clamp((f.y - H * 0.08) / Math.max(1, sandY - H * 0.08), 0, 1);
  var ds = 0.88 + 0.24 * dep;                 /* 越靠上越远、越小 */
  var L = f.len * ds, h = f.len * ds * (img.height / img.width);
  /* ---- 3D：纵深越大整体越大；转身面向镜头时裁到头部并放大 ---- */
  var zz = clamp((typeof f.z === 'number') ? f.z : 0.55, 0, 1);
  var yq = clamp((typeof f.yaw === 'number') ? f.yaw : 0, 0, 1);
  var zs = 0.54 + 0.86 * zz;                       /* 0.54(远) ~ 1.40(近) */
  var u0 = 0.30 * yq;                              /* 只保留头侧的部分，裁掉尾巴 */
  var WK = (0.72 + 0.28 * (1 - yq)) * zs;          /* 转身时身体变窄，头部被放大 */

  var bls = clamp((f.v || f.speed * 0.6) / Math.max(1, f.len), 0, 4);
  var rate = 1.00 + bls * 2.05 + ex * 2.6;
  var w = t * rate + (f.beat || 0);
  var ampY = h * (0.042 + Math.min(0.070, bls * 0.028) + ex * 0.030);
  var ampX = L * (0.004 + Math.min(0.010, bls * 0.004));

  var BW = _fbuf.width, BH = _fbuf.height;
  var needW = Math.ceil(L * 1.24) + 30, needH = Math.ceil(h * 1.7) + 30;
  if (needW > BW || needH > BH){
    _fbuf.width = Math.max(BW, needW); _fbuf.height = Math.max(BH, needH);
    BW = _fbuf.width; BH = _fbuf.height;
  }

  /* 以鱼体（而不是共享缓冲区）为基准：缓冲区尺寸变化也不会跳位置 */
  var bxH = BW / 2 - L / 2;
  var PADX = 8, PADY = h * 0.30;
  var shh = h + PADY * 2, sy0 = BH / 2 - shh / 2;
  var SW = L * (1 - u0) + PADX * 2, SH = shh;
  var g = _fctx;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = 'source-over';
  g.globalAlpha = 1;
  g.clearRect(0, 0, BW, BH);
  g.imageSmoothingEnabled = true;
  g.save();
  g.translate(BW / 2, BH / 2);
  if (face > 0) g.scale(-1, 1);               /* 统一成"头朝左"再切条 */

  var cols = 44;
  var cw = img.width / cols;
  var step = L / (cols - 1) + 2.2;
  /* ---- 躯干曲率波（FishSim 式行波 + 腱驱动的曲率偏置 bend） ---- */
  var M = 30;
  var amp = ((typeof f.waveAmp === 'number') ? f.waveAmp : 0.045) * (1 - 0.5 * yq);
  var hz = (typeof f.waveHz === 'number') ? f.waveHz : 1.5;
  var ph0 = t * hz * TAU + (f.wave0 || 0);
  var lam = 1.02;
  var bend = (typeof f.bend === 'number') ? f.bend : 0;
  var q, s2, i0, i1b, fr;
  for (q = 0; q <= M; q++){
    s2 = q / M;                                     /* 0 = 头, 1 = 尾 */
    var As = amp * (0.10 + 0.90 * Math.pow(s2, 1.7));
    var bendS = bend * Math.pow(s2, 1.35);
    _spineY[q] = (As * Math.sin(ph0 - s2 * TAU / lam) + bendS * 0.14) * L;
    _spineX[q] = L * (0.5 - s2);
  }
  for (q = 0; q <= M; q++){
    var qa = q > 0 ? q - 1 : 0, qb = q < M ? q + 1 : M;
    _spineA[q] = Math.atan2(_spineY[qb] - _spineY[qa], _spineX[qb] - _spineX[qa]);
  }
  for (var c = 0; c < cols; c++){
    var u = c / (cols - 1);                         /* 0 = 尾(源图左端) .. 1 = 头 */
    s2 = 1 - u;
    var fq = s2 * M;
    i0 = Math.floor(fq); if (i0 > M - 1) i0 = M - 1; if (i0 < 0) i0 = 0;
    i1b = i0 + 1; fr = fq - i0;
    /* 只做竖向位移，切片不旋转 —— 轮廓保持连续，不会被切出锯齿 */
    var ofsY = _spineY[i0] * (1 - fr) + _spineY[i1b] * fr;
    g.drawImage(img, cw * c, 0, cw, img.height, -L / 2 + L * u, -h / 2 + ofsY, step, h);
  }
  g.restore();

  /* ---- 转头：尾部被裁掉，切口羽化，不留生硬直线 ---- */
  if (u0 > 0.02){
    var fx = bxH - PADX + SW;
    g.globalCompositeOperation = 'destination-in';
    var fg = g.createLinearGradient(fx - L * 0.18, 0, fx, 0);
    fg.addColorStop(0, 'rgba(0,0,0,1)');
    fg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = fg;
    g.fillRect(0, 0, BW, BH);
    g.globalCompositeOperation = 'source-over';
  }

  /* ---- 只在鱼身上叠加：远近雾化、顶光、水面焦散 ---- */
  g.globalCompositeOperation = 'source-atop';
  var fog = 0.04 + 0.15 * (1 - dep) + 0.22 * (1 - zz);
  g.fillStyle = 'rgba(9,40,47,' + fog.toFixed(3) + ')';
  g.fillRect(0, 0, BW, BH);
  var gy0 = BH / 2 - h * 0.55, gy1 = BH / 2 + h * 0.55;
  var lg = g.createLinearGradient(0, gy0, 0, gy1);
  lg.addColorStop(0, 'rgba(210,255,250,0.13)');
  lg.addColorStop(0.45, 'rgba(180,240,238,0.02)');
  lg.addColorStop(1, 'rgba(2,16,20,0.16)');
  g.fillStyle = lg;
  g.fillRect(0, 0, BW, BH);
  g.globalCompositeOperation = 'source-over';

  /* ---- 合成：轻微运动模糊 + 主体 ---- */
  var ang = (typeof f.ang === 'number' && isFinite(f.ang)) ? f.ang : f.angle;
  var bobY = Math.sin(f.bob || 0) * L * 0.012;
  var alpha = (0.96 + 0.04 * dep) * (0.66 + 0.34 * zz);
  /* 以鱼体（而不是共享缓冲区）为基准裁切，缓冲区变大也不会跳位置 */
  var DW = L * (1 + 0.32 * yq) * zs;               /* 转身时整体放大，头部明显变大 */
  var DH = shh * zs * (1 + 0.08 * yq);
  /* 缓冲里是头朝左：向右游才镜像；旋转只用俯仰角，绝不整体转 π（否则就是倒着游） */
  var dirR = (typeof f.dir === 'number') ? (f.dir > 0) : (Math.cos(ang) >= 0);
  var pitch = clamp((typeof f.pitch === 'number' && isFinite(f.pitch)) ? f.pitch : 0, -0.42, 0.42);
  var mirror = dirR ? -1 : 1;
  var rot = (dirR ? pitch : -pitch) + (f.roll || 0) * (dirR ? 1 : -1);
  var px = (f.px === undefined) ? f.x : f.px;
  var py = (f.py === undefined) ? f.y : f.py;
  var dxm = f.x - px, dym = f.y - py;
  var gd = Math.sqrt(dxm * dxm + dym * dym);
  if (gd > 0.4){
    var gk = Math.min(1, 5 / gd);
    px = f.x - dxm * gk; py = f.y - dym * gk;
    ctx.save();
    ctx.globalAlpha = 0.10 * alpha;
    ctx.translate(px, py + bobY);
    ctx.rotate(rot);
    ctx.scale(mirror, 1);
    ctx.drawImage(_fbuf, bxH - PADX, sy0, SW, SH, -DW / 2, -DH / 2, DW, DH);
    ctx.restore();
  }
  f.px = f.x; f.py = f.y;

  ctx.save();
  ctx.imageSmoothingEnabled = true;
  ctx.globalAlpha = alpha;
  ctx.translate(f.x, f.y + bobY);
  ctx.rotate(rot);
  ctx.scale(mirror, 1);
  ctx.drawImage(_fbuf, bxH - PADX, sy0, SW, SH, -DW / 2, -DH / 2, DW, DH);
  ctx.restore();
}

/* ============================================================ 粒子 */
function spawnBubble(x, y){
  S.bubbles.push({ x: x, y: y, r: rnd(1.2, 3.4), vy: rnd(18, 44), ph: rnd(0, TAU) });
}
function updateBubbles(dt){
  for (var i = S.bubbles.length - 1; i >= 0; i--){
    var b = S.bubbles[i];
    b.y -= b.vy * dt;
    b.x += Math.sin(time * 2.4 + b.ph) * 6 * dt;
    if (b.y < -10) S.bubbles.splice(i, 1);
  }
  if (Math.random() < dt * 1.6){
    var px = Math.random() < 0.5 ? rnd(W * 0.02, W * 0.16) : rnd(W * 0.84, W * 0.98);
    spawnBubble(px + rnd(-14, 14), sandY + rnd(-6, 8));
  }
}
function drawBubbles(){
  for (var i = 0; i < S.bubbles.length; i++){
    var b = S.bubbles[i];
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, TAU);
    ctx.strokeStyle = 'rgba(200,245,245,0.28)';
    ctx.lineWidth = 0.9;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.34, b.r * 0.32, 0, TAU);
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fill();
  }
}
function buildMotes(){
  S.motes = [];
  var n = Math.round((W * H) / 14000);
  for (var i = 0; i < n; i++){
    S.motes.push({ x: rnd(0, W), y: rnd(0, H), r: rnd(0.4, 1.5),
                   vy: rnd(-7, -2), ph: rnd(0, TAU), a: rnd(0.05, 0.20) });
  }
}
function drawMotes(t){
  for (var i = 0; i < S.motes.length; i++){
    var m = S.motes[i];
    var y = m.y - ((t * -m.vy) % (H + 20));
    if (y < -10) y += H + 20;
    ctx.beginPath();
    ctx.arc(m.x + Math.sin(t * 0.5 + m.ph) * 7, y, m.r, 0, TAU);
    ctx.fillStyle = 'rgba(205,245,240,' + m.a + ')';
    ctx.fill();
  }
}
function addFood(x, y, n){
  for (var i = 0; i < (n || 4); i++){
    S.food.push({ x: x + rnd(-16, 16), y: y + rnd(-8, 8), vy: rnd(5, 13), ph: rnd(0, TAU), r: rnd(1.6, 2.6) });
  }
}
function updateFood(dt){
  for (var i = S.food.length - 1; i >= 0; i--){
    var f = S.food[i];
    f.y += f.vy * dt;
    f.x += Math.sin(time * 2 + f.ph) * 10 * dt;
    if (f.y > sandY + 6) S.food.splice(i, 1);
  }
}
function drawFood(){
  for (var i = 0; i < S.food.length; i++){
    var f = S.food[i];
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r, 0, TAU);
    ctx.fillStyle = 'rgba(226,196,140,0.85)';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(f.x - f.r * 0.3, f.y - f.r * 0.3, f.r * 0.45, 0, TAU);
    ctx.fillStyle = 'rgba(255,240,205,0.65)';
    ctx.fill();
  }
}
function addRipple(x, y){ S.ripples.push({ x: x, y: Math.min(y, H * 0.06), r: 4, a: 0.42 }); }
function drawRipples(dt){
  for (var i = S.ripples.length - 1; i >= 0; i--){
    var r = S.ripples[i];
    r.r += 90 * dt;
    r.a -= dt * 0.34;
    if (r.a <= 0){ S.ripples.splice(i, 1); continue; }
    ctx.beginPath();
    ctx.ellipse(r.x, r.y, r.r, r.r * 0.26, 0, 0, TAU);
    ctx.strokeStyle = 'rgba(220,255,250,' + r.a.toFixed(3) + ')';
    ctx.lineWidth = 1.4;
    ctx.stroke();
  }
}
function drawFishShadows(){
  return;   /* 去掉投影 */
  for (var i = 0; i < S.fish.length; i++){
    var f = S.fish[i];
    var y = sandY + 14 + (f.y - sandY) * 0.02;
    var rx = f.len * 0.34, ry = f.len * 0.07;
    var g = ctx.createRadialGradient(f.x, y, 0, f.x, y, rx);
    g.addColorStop(0, 'rgba(0,0,0,0.32)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(f.x, y, rx, ry, 0, 0, TAU);
    ctx.fill();
  }
}

var fpsAcc = 0, fpsN = 0, fpsShow = 0;
function dbgFish(){
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(6, 6, 900, 150);
  ctx.fillStyle = '#9ef';
  ctx.font = '15px Consolas, monospace';
  ctx.fillText('W=' + Math.round(W) + ' H=' + Math.round(H) + ' sandY=' + Math.round(sandY) + ' n=' + S.fish.length, 14, 28);
  var line = '';
  for (var i = 0; i < S.fish.length; i++){
    var f = S.fish[i];
    line += (f.sp.spr + ':' + Math.round(f.x) + ',' + Math.round(f.y) + ' d' + f.dir + ' L' + Math.round(f.len) + '  ');
    if (i % 3 === 2){ ctx.fillText(line, 14, 52 + Math.floor(i / 3) * 18); line = ''; }
  }
  if (line) ctx.fillText(line, 14, 52 + Math.floor(S.fish.length / 3) * 18);
  ctx.restore();
}
function fpsTick(dt){
  fpsAcc += dt; fpsN++;
  if (fpsAcc >= 1){ fpsShow = Math.round(fpsN / fpsAcc); fpsAcc = 0; fpsN = 0; }
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(W / 2 - 90, H / 2 - 40, 180, 80);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 18px Consolas, monospace';
  ctx.font = 'bold 40px Consolas, monospace';
  ctx.fillText('FPS ' + fpsShow, W / 2 - 70, H / 2 + 20);
  ctx.restore();
}
/* ============================================================ 光 */
var caustics = [];
var causTile = null, causPat = null;
function buildCausticsTile(){
  causTile = document.createElement('canvas');
  causTile.width = 256; causTile.height = 256;
  var c2 = causTile.getContext('2d');
  c2.globalCompositeOperation = 'lighter';
  for (var i = 0; i < 30; i++){
    var x = rnd(0, 256), y = rnd(0, 256), r = rnd(16, 54);
    var g = c2.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(255,255,238,0.50)');
    g.addColorStop(0.55, 'rgba(210,255,246,0.13)');
    g.addColorStop(1, 'rgba(190,245,240,0)');
    c2.fillStyle = g;
    c2.beginPath(); c2.arc(x, y, r, 0, Math.PI * 2); c2.fill();
  }
}
function drawCausticsWater(t){
  if (!causTile) buildCausticsTile();
  if (!causPat){ try { causPat = ctx.createPattern(causTile, 'repeat'); } catch (e){ return; } }
  var pat = causPat;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (var k = 0; k < 2; k++){
    var sc2 = 2.4 + k * 1.5;
    var ox = (t * (10 + k * 6)) % (256 * sc2);
    var oy = (t * (6 + k * 3)) % (256 * sc2);
    ctx.save();
    ctx.globalAlpha = 0.24 - k * 0.06;
    ctx.translate(-ox, -oy);
    ctx.scale(sc2, sc2);
    ctx.fillStyle = pat;
    ctx.fillRect(0, 0, (W + ox) / sc2 + 260, (k === 2 ? H : H * 0.68 + oy) / sc2 + 260);
    ctx.restore();
  }
  ctx.restore();
}
function buildLights(){
  caustics = [];
  for (var i = 0; i < 16; i++){
    caustics.push({ x: rnd(0, W), y: rnd(sandY - 30, H + 20), r: rnd(40, 130),
                    sp: rnd(0.10, 0.32), ph: rnd(0, TAU), a: rnd(0.05, 0.13) });
  }
  fxc.width = Math.max(1, Math.floor(W * 0.5));
  fxc.height = Math.max(1, Math.floor(H * 0.5));
}
function drawRays(t){
  var fxw = fxc.width, fxh = fxc.height;
  fxx.setTransform(1, 0, 0, 1, 0, 0);
  fxx.clearRect(0, 0, fxw, fxh);
  fxx.save();
  fxx.scale(0.5, 0.5);
  fxx.globalCompositeOperation = 'lighter';

  for (var i = 0; i < 7; i++){
    var cx = W * (0.06 + i * 0.11) + Math.sin(t * 0.19 + i * 1.7) * 70;
    var tw = 30 + i * 7;
    var g = fxx.createLinearGradient(0, 0, 0, sandY);
    g.addColorStop(0, 'rgba(200,252,246,0.22)');
    g.addColorStop(0.35, 'rgba(150,235,230,0.05)');
    g.addColorStop(1, 'rgba(110,210,210,0)');
    fxx.fillStyle = g;
    fxx.beginPath();
    fxx.moveTo(cx - tw / 2, -40);
    fxx.lineTo(cx + tw / 2, -40);
    fxx.lineTo(cx + tw * 1.6 + 40, sandY + 40);
    fxx.lineTo(cx + tw * 1.6 - 60, sandY + 40);
    fxx.closePath();
    fxx.fill();
  }
  fxx.restore();
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.70;
  ctx.drawImage(fxc, 0, 0, W, H);
  ctx.restore();
}
function drawCausticsOnSand(t){
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (var i = 0; i < caustics.length; i++){
    var c = caustics[i];
    var x = c.x + Math.sin(t * c.sp + c.ph) * 70;
    var y = c.y + Math.cos(t * c.sp * 0.8 + c.ph) * 12;
    var g = ctx.createRadialGradient(x, y, 0, x, y, c.r);
    g.addColorStop(0, 'rgba(225,255,248,' + (c.a * (0.7 + 0.3 * Math.sin(t * 0.7 + c.ph))).toFixed(3) + ')');
    g.addColorStop(0.55, 'rgba(190,245,235,' + (c.a * 0.30).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(160,230,225,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(x, y, c.r * 1.5, c.r * 0.6, 0, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}
function drawTankGlass(t){
  /* 顶部水面的亮光 */
  var g1 = ctx.createLinearGradient(0, 0, 0, H * 0.30);
  g1.addColorStop(0, 'rgba(198,255,248,0.22)');
  g1.addColorStop(0.45, 'rgba(150,235,230,0.07)');
  g1.addColorStop(1, 'rgba(120,210,210,0)');
  ctx.fillStyle = g1;
  ctx.fillRect(0, 0, W, H * 0.30);
  /* 四周暗角，像镜头透过玻璃 */
  var vg = ctx.createRadialGradient(W * 0.5, H * 0.46, Math.min(W, H) * 0.30,
                                    W * 0.5, H * 0.50, Math.max(W, H) * 0.80);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(0.62, 'rgba(2,18,22,0.14)');
  vg.addColorStop(1, 'rgba(0,10,14,0.62)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
  /* 玻璃反光：两条极淡的斜向亮带，缓慢漂移 */
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (var k = 0; k < 2; k++){
    var ox = W * (0.30 + k * 0.34) + Math.sin(t * 0.045 + k * 1.7) * 26;
    ctx.save();
    ctx.globalAlpha = 0.045 - k * 0.012;
    ctx.translate(ox, -H * 0.1);
    ctx.rotate(-0.30);
    var rg = ctx.createLinearGradient(0, 0, W * 0.16, 0);
    rg.addColorStop(0, 'rgba(230,255,252,0)');
    rg.addColorStop(0.5, 'rgba(230,255,252,0.9)');
    rg.addColorStop(1, 'rgba(230,255,252,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, W * 0.16, H * 1.4);
    ctx.restore();
  }
  ctx.restore();
}
function drawSurface(t){
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.beginPath();
  ctx.moveTo(0, 0);
  for (var x = 0; x <= W; x += 22){
    var y = 7 + Math.sin(x * 0.012 + t * 1.1) * 4 + Math.sin(x * 0.031 - t * 0.7) * 2;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, 0);
  ctx.closePath();
  var g = ctx.createLinearGradient(0, 0, 0, 26);
  g.addColorStop(0, 'rgba(190,255,250,0.22)');
  g.addColorStop(1, 'rgba(190,255,250,0)');
  ctx.fillStyle = g;
  ctx.fill();
  ctx.restore();
}

/* ============================================================ 行为 */
function angleLerp(a, b, t){
  var d = ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI;
  return a + d * clamp(t, 0, 1);
}
var SCHOOL_N = 3, SCHOOLS = [], schoolSeq = 0;
function ensureSchool(f){
  if (typeof f.school !== 'number' || f.school < 0 || f.school >= SCHOOL_N) f.school = (S.fish.indexOf(f) >= 0 ? S.fish.indexOf(f) : schoolSeq++) % SCHOOL_N;
  if (typeof f.slot !== 'number') f.slot = rnd(0, TAU);
  return f.school;
}
function resetSchools(){
  SCHOOLS = [];
  schoolSeq = 0;
  for (var i = 0; i < SCHOOL_N; i++){
    SCHOOLS.push({ tx: W * rnd(0.3, 0.7), ty: H * rnd(0.25, 0.45), timer: rnd(2, 7), vigor: 1, seed: rnd(0, TAU), spin: (Math.random() < 0.5 ? -1 : 1), ampX: 0.30, ampY: 0.15, rate: 0.11 });
  }
}
function updateSchools(dt, t){
  if (!SCHOOLS.length) resetSchools();
  for (var i = 0; i < S.fish.length; i++) ensureSchool(S.fish[i]);
  for (var k = 0; k < SCHOOLS.length; k++){
    var sc = SCHOOLS[k];
    sc.timer -= dt;
    if (sc.timer <= 0){
      sc.timer = rnd(8, 16);
      sc.seed = rnd(0, TAU);
      sc.ampX = rnd(0.26, 0.38);
      sc.ampY = rnd(0.12, 0.20);
      sc.rate = rnd(0.085, 0.135);
      sc.vigor = rnd(0.85, 1.20);
      sc.spin = (Math.random() < 0.5 ? -1 : 1);
    }
    if (typeof sc.rate !== 'number' || !isFinite(sc.rate)) sc.rate = 0.11;
    if (typeof sc.ampX !== 'number' || !isFinite(sc.ampX)) sc.ampX = 0.30;
    if (typeof sc.ampY !== 'number' || !isFinite(sc.ampY)) sc.ampY = 0.15;
    var ph = t * sc.rate + sc.seed;
    var tx = W * (0.5 + sc.ampX * Math.sin(ph));
    var ty = H * (0.34 + sc.ampY * Math.sin(ph * 1.41 + 1.1));
    sc.tx += (tx - sc.tx) * Math.min(1, dt * 0.55);
    sc.ty += (ty - sc.ty) * Math.min(1, dt * 0.55);
    sc.tx = clamp(sc.tx, W * 0.10, W * 0.90);
    sc.ty = clamp(sc.ty, H * 0.12, sandY * 0.62);
  }
}
function updateFish(f, dt, t){
  /* ===== 个体漫游模型：每条鱼各自为政，没有鱼群、没有互相推挤。
     水平朝向 dir(+1右/-1左) 与水平速度 vx 分离：掉头是"减速—翻向—加速"的过程；
     竖直只用 vy，且钳在 ±0.42*vx 的浅角内，所以鱼总是"头朝前、略斜着"游。 */
  if (typeof f.dir !== 'number' || (f.dir !== 1 && f.dir !== -1)) f.dir = Math.random() < 0.5 ? -1 : 1;
  if (typeof f.s1 !== 'number'){ f.s1 = rnd(0, TAU); f.s2 = rnd(0, TAU); f.s3 = rnd(0, TAU); }
  if (typeof f.pitch !== 'number' || !isFinite(f.pitch)) f.pitch = 0;
  if (typeof f.vx !== 'number' || !isFinite(f.vx)) f.vx = f.speed * 0.8;
  if (typeof f.vy !== 'number' || !isFinite(f.vy)) f.vy = 0;
  if (typeof f.turnT !== 'number' || !isFinite(f.turnT)) f.turnT = 0;
  if (typeof f.turnDur !== 'number') f.turnDur = 0.9;
  if (typeof f.hoverT !== 'number' || !isFinite(f.hoverT)) f.hoverT = 0;

  var topLim = Math.max(H * 0.05, f.len * 0.40);
  var botLim = sandY - f.len * 0.45;
  var sideM = f.len * 0.70 + 26;
  if (typeof f.prefY !== 'number' || !isFinite(f.prefY)) f.prefY = clamp(f.y, topLim + 40, Math.max(topLim + 60, botLim - 40));
  f.prefY = clamp(f.prefY, topLim + 30, Math.max(topLim + 50, botLim - 30));

  /* ---- 事件：只影响自己（吃食 / 逗鱼 / 鼠标好奇） ---- */
  var px = S.pointer.x, py = S.pointer.y;
  var goalX = null, goalY = null, urge = 0;
  var best = 1e9, bestFood = null;
  for (var i = 0; i < S.food.length; i++){
    var d = dist2(f.x, f.y, S.food[i].x, S.food[i].y);
    if (d < best){ best = d; bestFood = S.food[i]; }
  }
  if (bestFood && best < (W * 0.8) * (W * 0.8)){
    goalX = bestFood.x; goalY = bestFood.y; urge = 0.75;
    if (best < (f.len * 0.55) * (f.len * 0.55) && f.fullness < 1.15){
      var idx = S.food.indexOf(bestFood);
      if (idx >= 0){
        S.food.splice(idx, 1);
        f.fullness = Math.min(1.2, f.fullness + 0.34);
        addRipple(f.x, f.y - f.len * 0.25);
        f.excitation = Math.max(f.excitation, 0.5);
      }
    }
  } else if (f.excitation > 0.05){
    if (px > -999){
      var dd = Math.sqrt(dist2(f.x, f.y, px, py)) || 1;
      goalX = f.x + (f.x - px) / dd * 240;
      goalY = f.y + (f.y - py) / dd * 160;
    } else {
      goalX = f.x + f.dir * (170 + f.len);
      goalY = f.y + (Math.sin(t * 1.7 + f.s1) > 0 ? 1 : -1) * (70 + f.len * 0.9);
    }
    urge = 1;
  } else if (px > -999 && S.pointer.hover > 1.2 && dist2(f.x, f.y, px, py) < 320 * 320 && Math.random() < dt * 0.5){
    goalX = px + rnd(-50, 50); goalY = py + rnd(-40, 40); urge = 0.3;
  }

  /* ---- 掉头决策：只有"目标在背后"或"靠近侧壁"才掉头 ---- */
  var wantLeft = (goalX !== null) ? (goalX < f.x) : false;
  var needTurn = false;
  if (f.turnT <= 0){
    if (f.dir > 0 && f.x > W - sideM) needTurn = true;
    else if (f.dir < 0 && f.x < sideM) needTurn = true;
    else if (goalX !== null && Math.abs(goalX - f.x) > f.len * 0.8 && ((wantLeft && f.dir > 0) || (!wantLeft && f.dir < 0))) needTurn = true;
  }
  if (needTurn){ f.turnT = f.turnDur; f.newDir = -f.dir; }

  /* ---- 速度：巡游 + 缓起伏；掉头时减速到 16%，过中点再加速 ---- */
  var cruise = f.speed * (1 + 0.16 * Math.sin(t * 0.5 + f.s1) + 0.07 * Math.sin(t * 1.3 + f.s2));
  if (urge > 0) cruise *= (1 + urge * 1.5);
  var vxT = cruise;
  if (f.turnT > 0){
    f.turnT -= dt;
    var prog = 1 - clamp(f.turnT / f.turnDur, 0, 1);
    if (prog > 0.5 && f.newDir) f.dir = f.newDir;
    var bell = Math.abs(prog - 0.5) * 2;
    vxT = cruise * (0.35 + 0.65 * bell);
    f.pitch *= (1 - Math.min(1, dt * 5));
    f.bendT = Math.sin(Math.PI * prog) * (f.newDir > 0 ? -1 : 1);
  }
  if (f.turnT <= 0) f.bendT = 0.045 * Math.sin(t * 0.62 + f.s2);
  if (typeof f.bend !== 'number' || !isFinite(f.bend)) f.bend = 0;
  f.bend += (f.bendT - f.bend) * Math.min(1, dt * 7);
  var wv = clamp(f.vx / Math.max(20, cruise), 0.15, 1.7);
  f.waveAmp = 0.030 + 0.030 * wv + (f.turnT > 0 ? 0.012 : 0);
  f.waveHz = 0.62 + 0.42 * wv;
  if (f.hoverT > 0){ f.hoverT -= dt; vxT *= 0.22; }
  else if (Math.random() < dt * 0.02){ f.hoverT = rnd(1.2, 2.6); }
  f.vx += (vxT - f.vx) * Math.min(1, dt * 1.8);
  if (f.vx < 4) f.vx = 4;

  /* ---- 竖直：缓慢换水层，速度钳在浅角内 ---- */
  var vyT;
  if (goalY !== null && goalY < 1e9){
    vyT = clamp((goalY - f.y) * 1.1, -cruise * 0.50, cruise * 0.50);
  } else {
    f.prefY += Math.sin(t * 0.055 + f.s3) * 9 * dt;
    f.prefY = clamp(f.prefY, topLim + 30, Math.max(topLim + 50, botLim - 30));
    var band = f.prefY + Math.sin(t * 0.21 + f.s1) * 30 + Math.sin(t * 0.57 + f.s2) * 12;
    vyT = clamp((band - f.y) * 0.55, -cruise * 0.34, cruise * 0.34);
  }
  if (f.turnT > 0) vyT *= 0.45;
  f.vy += (vyT - f.vy) * Math.min(1, dt * 1.7);
  var vLimit = Math.abs(f.vx) * 0.42;
  f.vy = clamp(f.vy, -vLimit, vLimit);

  /* ---- 俯仰与位移 ---- */
  var pT = Math.atan2(f.vy, Math.max(24, f.vx));
  f.pitch += (clamp(pT, -0.34, 0.34) - f.pitch) * Math.min(1, dt * 4.5);
  f.x += f.dir * f.vx * dt;
  f.y += f.vy * dt;

  /* ---- 边界：软掉头 + 反弹，不瞬移 ---- */
  var edge = f.len * 0.62 + 10;
  if (f.x < edge){ f.x = edge; if (f.dir < 0) f.dir = 1; }
  if (f.x > W - edge){ f.x = W - edge; if (f.dir > 0) f.dir = -1; }
  if (f.y < topLim){ f.y = topLim; if (f.vy < 0) f.vy = -f.vy * 0.3; f.prefY = Math.max(f.prefY, topLim + 60); }
  if (f.y > botLim){ f.y = botLim; if (f.vy > 0) f.vy = -f.vy * 0.3; f.prefY = Math.min(f.prefY, Math.max(topLim + 70, botLim - 60)); }

  /* ---- 兼容旧字段 ---- */
  f.bob = (typeof f.bob === 'number' ? f.bob : rnd(0, TAU)) + dt * (0.55 + f.vx * 0.004);
  f.roll = clamp(f.vy / Math.max(40, f.vx) * 0.30, -0.13, 0.13) + Math.sin(f.bob * 0.8) * 0.018;
  f.ang = f.dir > 0 ? f.pitch : Math.PI - f.pitch;
  f.angle = f.ang;
  f.v = f.vx;
  f.excitation = Math.max(0, f.excitation - dt * 1.1);
  /* ---- 第三维：纵深 z（越近越大）+ 周期性转身面向镜头 yaw ---- */
  f.z = clamp(0.50 + 0.50 * Math.sin(t * 0.165 + (f.s1 || 0) * 1.7), 0, 1);
  f.yaw = smooth(0.55, 0.99, Math.sin(t * 0.205 + (f.s3 || 0) * 2.3));
  f.fullness = Math.max(0, f.fullness - dt * 0.006);
}
/* ============================================================ 主循环 */
function frame(now){ try {
  if (window.innerWidth !== W || window.innerHeight !== H) resize();
  var dt = Math.min(0.05, (now - (frame.last || now)) / 1000);
  frame.last = now;
  time += dt;
  var i;

  S.pointer.speed *= Math.pow(0.02, dt);
  S.pointer.hover += dt;

  for (i = 0; i < S.fish.length; i++) updateFish(S.fish[i], dt, time);
  updateFood(dt);
  updateBubbles(dt);

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.drawImage(bgc, 0, 0, W, H);

  drawRays(time);
  drawCausticsWater(time);
  drawCausticsOnSand(time);
  for (i = 0; i < S.plants.length; i++) drawPlant(S.plants[i], time, false);
  if (S.sandFront) ctx.drawImage(S.sandFront, 0, S.sandFrontY, W, S.sandFrontH);
  drawMotes(time);
  drawFishShadows();

  var order = S.fish.slice().sort(function(a, b){ return ((a.z || 0) - (b.z || 0)) || (a.len - b.len); });
  for (i = 0; i < order.length; i++) drawFish(order[i], time);

  drawBubbles();
  drawFood();
  drawRipples(dt);
  for (i = 0; i < S.front.length; i++) drawPlant(S.front[i], time, true);
  drawTankGlass(time);
  drawSurface(time);
  if (location.search.indexOf('dbg') >= 0) dbgFish();
  if (location.search.indexOf('fps') >= 0) fpsTick(dt);
  } catch (e){ ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H); ctx.fillStyle = '#ff5555'; ctx.font = 'bold 22px sans-serif'; ctx.fillText('ERR ' + e.message, 40, 60); }

  S.hudT += dt;
  if (S.hudT > 0.4){ S.hudT = 0; updateHud(); }
  if (WALL) setInterval(function(){ if (document.title !== 'AQUARIUM_WALL_LAYER') document.title = 'AQUARIUM_WALL_LAYER'; }, 1000); /* __titleKeeper */
requestAnimationFrame(frame);
}

/* ============================================================ 尺寸 */
function resize(){
  W = window.innerWidth;
  H = window.innerHeight;
  DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.max(1, Math.floor(W * DPR));
  cv.height = Math.max(1, Math.floor(H * DPR));
  cv.style.width = W + 'px';
  cv.style.height = H + 'px';
  VH = WALL ? Math.min(H, ((window.screen && window.screen.height) || H) * 0.8) : H;
  sandY = Math.round((typeof PHOTO !== 'undefined' && PHOTO ? H : VH) * 0.87);

  buildBackground();
  buildPlants();
  buildLights();
  buildMotes();

  for (var i = 0; i < S.fish.length; i++){
    S.fish[i].x = clamp(S.fish[i].x, 40, W - 40);
    S.fish[i].y = clamp(S.fish[i].y, H * 0.08, sandY - 20);
  }
}

/* ============================================================ 存档 */
function save(){
  try {
    localStorage.setItem(KEY, JSON.stringify({
      fish: S.fish.map(function(f){ return { spr: f.sp.spr, x: f.x / W, y: f.y / H, len: f.len, full: f.fullness, ang: f.ang, v: f.v }; })
    }));
  } catch (e){}
}
function load(){
  try {
    var raw = localStorage.getItem(KEY);
    if (!raw) return false;
    var d = JSON.parse(raw);
    if (!d || !d.fish || !d.fish.length) return false;
    var arr = [];
    for (var i = 0; i < d.fish.length; i++){
      var q = d.fish[i];
      var key = q.spr || q.id;
      var found = null;
      for (var k = 0; k < SPECIES.length; k++) if (SPECIES[k].spr === key){ found = SPECIES[k]; break; }
      if (!found) continue;
      var px = (q.x <= 1.6 ? q.x * W : q.x);
      var py = (q.y <= 1.6 ? q.y * H : q.y);
      var f = makeFish(found, q.len, px, py, q.full);
      if (typeof q.ang === 'number' && isFinite(q.ang)){ f.angle = q.ang; f.ang = q.ang; }
      if (typeof q.v === 'number' && isFinite(q.v)) f.v = q.v;
      arr.push(f);
    }
    if (!arr.length) return false;
    if (arr.length < 2) return false;
    S.fish = arr;
    return true;
  } catch (e){ return false; }
}

/* ============================================================ 事件 */
var lastMove = 0;
window.addEventListener('mousemove', function(e){
  var now = performance.now();
  var dt = Math.max(0.001, (now - (lastMove || now - 16)) / 1000);
  lastMove = now;
  var p = S.pointer;
  var d = Math.sqrt(dist2(e.clientX, e.clientY, p.x, p.y));
  if (d > 3) p.hover = 0;
  p.x = e.clientX; p.y = e.clientY;
  if (d / dt > 1400){
    for (var i = 0; i < S.fish.length; i++){
      if (dist2(S.fish[i].x, S.fish[i].y, e.clientX, e.clientY) < 260 * 260)
        S.fish[i].excitation = 1;
    }
  }
}, { passive: true });

window.addEventListener('mousedown', function(e){
  addFood(e.clientX, Math.max(e.clientY, H * 0.04), 5);
  addRipple(e.clientX, e.clientY * 0.25);
}, { passive: true });

window.addEventListener('keydown', function(e){
  if (e.key === ' ' || e.code === 'Space'){ feedRandom(); e.preventDefault(); }
  else if (e.key === 'f' || e.key === 'F'){
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(function(){});
    else document.exitFullscreen();
  }
});

function feedRandom(){
  for (var i = 0; i < 3; i++) addFood(rnd(W * 0.2, W * 0.8), H * 0.05, 2);
  addRipple(W * 0.5, H * 0.03);
}
function petSome(){
  var n = Math.min(S.fish.length, 2 + ((Math.random() * 2) | 0));
  for (var k = 0; k < n; k++){
    var f = S.fish[(Math.random() * S.fish.length) | 0];
    if (f) f.excitation = 1;
  }
  addRipple(rnd(W * 0.25, W * 0.75), H * 0.05);
}
function petAll(){
  for (var i = 0; i < S.fish.length; i++) S.fish[i].excitation = 1;
  addRipple(rnd(W * 0.3, W * 0.7), H * 0.05);
}

/* ============================================================ HUD */
function updateHud(){
  var hud = document.getElementById('hud');
  if (!hud || WALL) return;
  var kinds = {};
  for (var i = 0; i < S.fish.length; i++) kinds[S.fish[i].sp.name] = (kinds[S.fish[i].sp.name] || 0) + 1;
  var parts = [];
  for (var k in kinds) parts.push(k + ' \u00d7' + kinds[k]);
  hud.innerHTML = '<b>' + S.fish.length + '</b> \u6761\u9c7c<i>\u00b7</i>' + parts.join(' \u00b7 ');
  hud.classList.add('on');
}

/* ============================================================ UI */
var picker = document.getElementById('picker');

function iconFor(sp){
  var c = document.createElement('canvas');
  c.width = 192; c.height = 96;
  var src = SPR[sp.spr];
  if (src){
    var x = c.getContext('2d');
    var w = 176, h = w * src.height / src.width;
    if (h > 88){ h = 88; w = h * src.width / src.height; }
    x.drawImage(src, (192 - w) / 2, (96 - h) / 2, w, h);
  }
  return c;
}

function buildPicker(){
  if (!picker || WALL) return;
  picker.innerHTML = '';
  SPECIES.forEach(function(sp){
    var d = document.createElement('div');
    d.className = 'card';
    d.appendChild(iconFor(sp));
    var s = document.createElement('span');
    s.textContent = sp.name;
    d.appendChild(s);
    d.addEventListener('click', function(){
      S.fish.push(makeFish(sp));
      picker.classList.remove('on');
    });
    picker.appendChild(d);
  });
}
window.addEventListener('load', function(){ setTimeout(buildPicker, 500); });

var btns = document.querySelectorAll('.btn');
for (var bi = 0; bi < btns.length; bi++){
  btns[bi].addEventListener('click', function(){
    var a = this.getAttribute('data-act');
    if (a === 'feed') feedRandom();
    else if (a === 'pet') petAll();
    else if (a === 'clean'){ for (var i2 = 0; i2 < 10; i2++) spawnBubble(rnd(W * 0.1, W * 0.9), rnd(H * 0.4, sandY)); }
    else if (a === 'add') picker.classList.toggle('on');
  });
}

/* ============================================================ 启动 */
function seedFish(){
  if (S.fish.length || !SPECIES.length) return;
  if (load()) return;
  var plan = [
    [0, 118, 0.16, 0.26], [1, 108, 0.50, 0.20], [2, 106, 0.34, 0.46], [3,  86, 0.66, 0.30],
    [4, 102, 0.80, 0.50], [5,  98, 0.26, 0.60], [6,  84, 0.58, 0.64], [7, 112, 0.42, 0.34],
    [8, 104, 0.12, 0.44], [0, 100, 0.88, 0.22]
  ];
  for (var i = 0; i < plan.length; i++){
    var sp2 = SPECIES[plan[i][0]] || SPECIES[0];
    S.fish.push(makeFish(sp2, plan[i][1] * clamp(W / 1536, 0.8, 1.4), W * plan[i][2], H * plan[i][3]));
  }
}
window.addEventListener('load', seedFish);

resize();
window.addEventListener('resize', function(){ resize(); });

/*DBG*/
if (location.search.indexOf('dbg') >= 0){
  setTimeout(function(){
    var d = document.createElement('pre');
    d.id = 'dbgout';
    d.textContent = 'SPR=' + Object.keys(SPR).join(',') + '|SPECIES=' + SPECIES.map(function(x){ return x.spr + ':' + x.len[0]; }).join(',') + '|FISH=' + S.fish.map(function(f){ return f.sp.spr + '@' + Math.round(f.x) + ',' + Math.round(f.y); }).join(',');
    document.body.appendChild(d);
  }, 2500);
}
setInterval(save, 8000);
if (WALL){
  setInterval(function(){ for (var i = 0; i < 2; i++) addFood(rnd(W * 0.22, W * 0.78), H * 0.07, 2); }, 30000);
  setInterval(petSome, 19000);
}
requestAnimationFrame(frame);
})();
</script>
